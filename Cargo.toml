[package]
name = "simctl"
version = "0.1.0"
edition = "2021"
authors = ["roy <roy@nura.eco>"]
description = "Lightweight, robust cellular SIM and modem management CLI and daemon for Qualcomm-based Nura OS"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.4", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"

[lints.clippy]
uninlined_format_args = "warn"
assigning_clones = "warn"
needless_pass_by_value = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

